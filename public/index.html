*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#17202a;color:#f7f4ea}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative}.app.locked>:not(.login-gate){visibility:hidden}.login-gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 18%,#fff,transparent 42%),linear-gradient(160deg,#eef3f5,#dce7ec);color:#102845}.login-gate.off{display:none!important}.login-card{width:min(420px,94vw);padding:32px 30px 26px;border-radius:18px;background:rgba(249,245,236,.96);box-shadow:0 24px 70px rgba(17,35,51,.18);border:1px solid rgba(16,40,69,.12);text-align:center}.login-star{font-size:32px;color:#b18a34}.login-kicker{margin-top:4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#b18a34}.login-card h1{margin:8px 0 0;font-weight:normal;line-height:1}.login-card h1 span{display:block;font-size:36px}.login-card h1 small{display:block;margin-top:8px;font-size:17px;font-weight:normal;white-space:nowrap}.login-version{margin:9px 0 22px;font-size:11px;letter-spacing:.14em;opacity:.6}.login-card label{display:block;text-align:left;font-size:12px;margin-bottom:6px}.password-row{display:grid;grid-template-columns:1fr 44px;gap:7px}.password-row input{height:46px;padding:0 12px;border:1px solid rgba(16,40,69,.2);border-radius:10px;background:#fff;color:#102845}.password-row button{border:1px solid rgba(16,40,69,.16);border-radius:10px;background:#fff}.login-error{height:21px;padding-top:5px;text-align:left;color:#a33;font-size:12px}.login-submit{width:100%;height:46px;border:0;border-radius:999px;background:#102845;color:#fff;cursor:pointer}.login-note{margin-top:15px;font-size:11px;opacity:.5}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#10171e}.brand{font-weight:800}.meta{font-size:14px;opacity:.75}.stage{display:grid;place-items:center;padding:24px}.spread{width:min(1200px,94vw);aspect-ratio:2/1;background:#f4ecd9;color:#263238;border-radius:10px;box-shadow:0 18px 50px #0008;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#0002}.page{padding:6%;display:flex;flex-direction:column;justify-content:center}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;opacity:.55}.title{font-size:clamp(30px,4vw,62px);line-height:1;margin:.35em 0}.note{font-size:clamp(16px,1.8vw,25px);line-height:1.35;max-width:30ch}.visual{align-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#fff8 0 8%,transparent 9%),linear-gradient(145deg,#dbe8df,#9fb8b0)}.scene{font-size:clamp(70px,12vw,170px);filter:grayscale(.15)}.caption{margin-top:18px;font-size:14px;opacity:.65}.controls{display:flex;gap:12px;justify-content:center;align-items:center;padding:16px;background:#10171e}.controls button,.controls select{border:0;border-radius:999px;padding:10px 16px;font:inherit}.controls button{cursor:pointer}.counter{min-width:90px;text-align:center}.hint{font-size:12px;opacity:.55}@media(max-width:700px){.spread{aspect-ratio:auto;min-height:70vh;grid-template-columns:1fr}.spread:after{display:none}.visual{min-height:35vh}.hint{display:none}}
</style></head><body><div class="app locked" id="app"><section class="login-gate" id="loginGate"><div class="login-card"><div class="login-star">✦</div><div class="login-kicker">Geschützte Vorschau</div><h1><span>Atlas</span><small>– der kleine Puffin –</small></h1><div class="login-version">VISUAL V2.1</div><form id="loginForm"><label for="passwordInput">Passwort</label><div class="password-row"><input id="passwordInput" type="password" autocomplete="current-password" required><button id="togglePasswordBtn" type="button" aria-label="Passwort anzeigen">👁</button></div><div class="login-error" id="loginError"></div><button class="login-submit" type="submit">Vorschau öffnen</button></form><div class="login-note">Private Preview · nicht zur Weitergabe bestimmt</div></div></section><header class="top"><div><div class="brand">Der kleine Puffin Atlas · Visual V2.1</div><div class="meta" id="chapter"></div></div><div class="meta">Doppelseiten-Dummy · Worker 2</div></header><main class="stage"><section class="spread"><div class="page"><div class="eyebrow" id="number"></div><h1 class="title" id="title"></h1><div class="note" id="note"></div></div><div class="page visual"><div class="scene" id="scene"></div><div class="caption">Low-Fidelity-Platzhalter · wird durch die jeweilige Illustration ersetzt</div></div></section></main><footer class="controls"><button id="prev">← Zurück</button><span class="counter" id="counter"></span><select id="jump" aria-label="Doppelseite wählen"></select><button id="next">Weiter →</button><span class="hint">Tastatur: ← / →</span></footer></div><script>
const AUTH_HASH='36528548bad31d9c58f9300aba765aaa874fb3c302cfd1f9f2fda6d1ed7985a7',AUTH_KEY='atlasBookAuthV31',AUTH_MS=7*24*60*60*1000;const $=id=>document.getElementById(id);async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function validSession(){try{const s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');return !!(s&&s.expires>Date.now())}catch{return false}}function unlock(){localStorage.setItem(AUTH_KEY,JSON.stringify({expires:Date.now()+AUTH_MS}));$('app').classList.remove('locked');$('loginGate').classList.add('off');setTimeout(()=>$('passwordInput').value='',200)}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';if(await sha256($('passwordInput').value)===AUTH_HASH)unlock();else{$('loginError').textContent='Das Passwort ist nicht richtig.';$('passwordInput').select()}});$('togglePasswordBtn').onclick=()=>{const show=$('passwordInput').type==='password';$('passwordInput').type=show?'text':'password';$('togglePasswordBtn').textContent=show?'🙈':'👁'};
const pages=[["Atlas’ Welt","I · Etwas stimmt nicht","Hafnarhólmi · Weltbuch · Riesennase","🐧📖"],["Tara ist wieder da","I · Etwas stimmt nicht","Tara erzählt · Atlas zeichnet","🐦💨"],["Zwei Wörter","I · Etwas stimmt nicht","Der Wächter Islands","❓🏔️"],["Die leere Seite","I · Etwas stimmt nicht","Fehlversuche · Fragezeichen · Entschluss","✏️❓"],["Álfaborg","II · Atlas sucht","Lauschen · unsichtbare Bewohner · Mysterium","🪨👂"],["Vestrahorn: Ich hab dich!","II · Atlas sucht","Berg + Spiegelung · erster großer Treffer","🏔️🪞"],["PLATSCH","II · Atlas sucht","Spiegelbild zerbricht · Wahrnehmung kippt","💦🐧"],["Runa im Wind","II · Atlas sucht","Stärke durch Erfahrung und Trittsicherheit","🐴💨"],["Jökulsárlón","II · Atlas sucht","Eiswelt · dunkler Rücken hinter dem Eis","🧊🌊"],["Brim","II · Atlas sucht","Wal-Auftritt · Atlas erzählt seine Reise","🐋📖"],["Wo ist Brim?","II · Atlas sucht","Nicht sichtbar bedeutet nicht weg","🌊❓"],["Nori klaut Frühstück","III · Reise wird größer","Nähe · Komik · neuer Reisegefährte","🦊🐟"],["Unterwegs mit Nori","III · Reise wird größer","Erleben statt nur suchen · Weltbuch füllt sich","🐧🦊"],["Reynisdrangar","III · Reise wird größer","Visuelle Schlüsselstation · Felsen wie Gestalten","🌊🗿"],["Nori war hier","III · Reise wird größer","Nicht der Wächter · Abschied von Nori","🐾📖"],["Skógafoss – Jetzt aber","IV · Suche bricht zusammen","Wasserfall · Schatzgeschichte · letzter Ansatz","💧🏔️"],["Zu viele Bilder","IV · Suche bricht zusammen","Volles Weltbuch · keine eindeutige Antwort · Tiefpunkt","📖🌀"],["Tara und die andere Frage","IV · Suche bricht zusammen","WORAUF MUSS ICH ACHTEN?","🐦❓"],["Die kleine Pflanze","V · Anders schauen","Atlas zeichnet ohne vorher zu urteilen","🌱💨"],["Anders","V · Anders schauen","Westmännerinseln · Weltbuch · Blick aufs Meer","🐧🌊"]];let i=0;pages.forEach((p,n)=>$('jump').add(new Option(`DS ${n+1} · ${p[0]}`,n)));function render(){const p=pages[i];$('number').textContent=`Doppelseite ${i+1}`;$('title').textContent=p[0];$('chapter').textContent=p[1];$('note').textContent=p[2];$('scene').textContent=p[3];$('counter').textContent=`${i+1} / ${pages.length}`;$('jump').value=i;$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;location.hash=`ds${String(i+1).padStart(2,'0')}`}function go(n){i=Math.max(0,Math.min(pages.length-1,n));render()}$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('jump').onchange=e=>go(+e.target.value);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight')go(i+1)});const m=location.hash.match(/ds(\d+)/);if(m)i=Math.max(0,Math.min(19,+m[1]-1));render();if(validSession())unlock();else setTimeout(()=>$('passwordInput').focus(),100);
</script></body></html>
